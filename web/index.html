<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Direct control over USB MIDI and a preset (.hlx) editor for the Line 6 HX Stomp. Experimental.">
<meta name="theme-color" content="#181b20">
<title>HX Stomp Control</title>
<link rel="icon" href="icon.svg?v=0.2.2" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=0.2.2">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg?v=0.2.2" width="24" height="24" alt="">
    <span>HX Stomp <b>Control</b></span><span class="exp-badge" title="Early test version">Experimental</span></div>
  <button id="status" class="status" title="Connection — tap to connect"></button>
</header>
<nav class="tabs">
  <button data-page="direct"><span class="ti">◉</span><span>Direct</span></button>
  <button data-page="presets"><span class="ti">☰</span><span>Presets</span></button>
  <button data-page="editor"><span class="ti">✎</span><span>Editor</span></button>
  <button data-page="midi" class="only-wide"><span class="ti">⇄</span><span>MIDI</span></button>
  <button data-page="system"><span class="ti">⚙</span><span>System</span></button>
  <button data-page="help"><span class="ti">?</span><span>Help</span></button>
</nav>
<main id="main"></main>
<input id="fileinput" type="file" accept=".hlx,.hls,application/json" hidden>
<div id="toasts"></div>
<script src="js/midimap.js?v=0.2.2"></script>
<script src="js/hlx.js?v=0.2.2"></script>
<script src="js/platform.js?v=0.2.2"></script>
<script src="js/app.js?v=0.2.2"></script>
</body>
</html>
